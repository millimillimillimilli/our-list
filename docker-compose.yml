services:
  sharedtasks:
    build: .
    container_name: sharedtasks
    restart: unless-stopped
    ports:
      - "8123:8000"
    volumes:
      - sharedtasks-data:/data
    # No environment variables needed — this is multi-tenant now. Each
    # household signs up in the app itself and gets its own private login
    # code; there's no shared app-wide password to configure. DATA_ROOT
    # defaults to /data, matching the volume above.

volumes:
  sharedtasks-data:
