version: "3.8"

services:
  sharedtasks:
    build: .
    container_name: sharedtasks
    restart: unless-stopped
    ports:
      - "8123:8000"
    volumes:
      - sharedtasks-data:/data
    environment:
      # Optional: set a private ntfy.sh topic name to get real phone
      # notifications ("Caroline added a task") even when the app is closed.
      # Pick something unguessable, e.g. "our-house-tasks-x7q2".
      # Install the ntfy app (Android/iOS) and subscribe to the same topic.
      # Leave blank to disable notifications entirely.
      - NTFY_TOPIC=${NTFY_TOPIC:-}
      - NTFY_SERVER=${NTFY_SERVER:-https://ntfy.sh}
      # Optional: set a shared household password to require login before the
      # app can be used at all (recommended, since anyone with the URL can
      # otherwise reach it). Leave blank to keep the app open with no login.
      - APP_PASSWORD=${APP_PASSWORD:-}

volumes:
  sharedtasks-data:
