services:
  - type: web
    name: our-list
    runtime: docker
    plan: starter # persistent disks require a paid plan — data won't survive restarts on the free tier
    healthCheckPath: /
    disk:
      name: our-list-data
      mountPath: /data
      sizeGB: 1
    # No environment variables needed — DATA_ROOT defaults to /data, matching
    # the disk above. Households sign up inside the app itself (no deploy-time
    # password to configure); each gets its own private login code.
